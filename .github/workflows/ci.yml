name: CI
#decidimos cuando se ejecuta
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    #maquina virtual
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/barbershop_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: barbershop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d barbershop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
